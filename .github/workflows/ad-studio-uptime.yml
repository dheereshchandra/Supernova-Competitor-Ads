name: Ad Studio uptime (public)

# Off-tailnet uptime check for the Ad Studio public URL. This is the ONLY vantage that
# tests the real public Funnel edge — a check from the host Mac resolves the *.ts.net
# name via MagicDNS to the tailnet IP and bypasses the public edge, so it can't catch
# the "remote users can't reach it" outage. GitHub runners are off-tailnet, so they hit
# the genuine public path.
#
# EDGE-TRIGGERED (added 2026-06-17): it Slack-alerts only ONCE when the public URL first
# goes down, and once when it recovers — not every 5 minutes for the whole outage. The
# "previous state" is read from this workflow's own last completed run conclusion (failure
# == was down, success == was up). This matters most during a planned Google-scrape VPN
# window: the site is intentionally unreachable for many minutes, the local Ad Studio
# watchdog already posts a single "DOWN (VPN on)", and without de-duping THIS monitor would
# otherwise re-post a red DOWN every ~5 min into the same Slack channel.
#
# Setup (once): add the Slack webhook as a repo secret so failures page the team:
#     gh secret set SLACK_WEBHOOK_URL --body "https://hooks.slack.com/services/..."
#
# NOTE: GitHub's scheduled cron is best-effort (can lag/skip under load) and the runners
# are IPv4-only — so this catches a TOTAL public outage (stale Funnel edge / host down)
# but NOT a carrier-IPv6-only failure. For 1-minute checks, confirmation counts, and an
# IPv6 probe, add a free UptimeRobot/BetterStack monitor too (see the watchdog README).

on:
  schedule:
    - cron: '*/5 * * * *'      # every ~5 minutes (best-effort)
  workflow_dispatch: {}         # allow a manual run from the Actions tab

concurrency:
  group: ad-studio-uptime
  cancel-in-progress: true

permissions:
  actions: read                 # gh run list (read this workflow's previous conclusion)
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      URL: https://dheeresh.tail92accf.ts.net/api/health   # must match STUDIO_PUBLIC_URL
    steps:
      - name: Probe public /api/health (IPv4, 2 strikes)
        id: probe
        run: |
          probe() { curl -4 -sS --max-time 20 "$URL"; }
          ok=false
          for attempt in 1 2; do
            body="$(probe || true)"
            echo "attempt $attempt: ${body:0:200}"
            if printf '%s' "$body" | grep -q '"ok":true'; then ok=true; break; fi
            [ "$attempt" = 1 ] && sleep 20
          done
          if [ "$ok" = true ]; then
            echo "down=false" >> "$GITHUB_OUTPUT"
          else
            echo "down=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Read previous state (last completed run's conclusion)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # failure == previous run saw the site DOWN; success == it was UP. Best-effort:
          # if the API is unreachable, leave it empty so we fail OPEN (alert rather than miss).
          prev="$(gh run list --repo "${{ github.repository }}" --workflow ad-studio-uptime.yml \
                    --status completed --limit 12 --json conclusion \
                    --jq 'map(select(.conclusion=="success" or .conclusion=="failure")) | .[0].conclusion' \
                    2>/dev/null || echo '')"
          echo "conclusion=${prev}" >> "$GITHUB_OUTPUT"
          echo "previous completed conclusion: ${prev:-unknown}"

      - name: Alert Slack — DOWN (only on the down edge)
        if: steps.probe.outputs.down == 'true' && steps.prev.outputs.conclusion != 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret not set — cannot alert. Run: gh secret set SLACK_WEBHOOK_URL"
            exit 0
          fi
          curl -sS -m 10 -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data '{"text":":rotating_light: *Ad Studio is DOWN on the public URL* — '"$URL"' did not return ok over the public internet (2 strikes). If this coincides with a planned Google-scrape VPN window it is expected (the local watchdog already flagged it); otherwise the Tailscale Funnel edge or the host Mac is unreachable — check the Mac, then tail ~/Library/Application Support/SupernovaAdStudioWatchdog/watchdog.log. (You will get ONE more alert when it recovers.)"}'

      - name: Alert Slack — RECOVERED (only on the up edge)
        if: steps.probe.outputs.down == 'false' && steps.prev.outputs.conclusion == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "${SLACK_WEBHOOK_URL:-}" ] && exit 0
          curl -sS -m 10 -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data '{"text":":white_check_mark: *Ad Studio is back UP on the public URL* — '"$URL"' is returning ok over the public internet again."}'

      - name: Reflect DOWN in the run status
        if: steps.probe.outputs.down == 'true'
        run: |
          echo "Public URL is DOWN — failing the run so the Actions tab shows red and the next"
          echo "run can read this 'failure' conclusion as the previous state (edge-trigger)."
          exit 1
